# markdownlint-cli2 config for embodiment.
# markdownlint-cli2 stops walking at the git root, so a per-user global config
# in the home directory isn't picked up from inside the repo.
# Mirrors the guildmaster / steward / teken preset for workspace consistency.

config:
  default: true
  # MD013: Line length — disabled. Prose lines wrap at the reader.
  MD013: false
  # MD060: Table pipe spacing — disabled (stylistic preference).
  MD060: false
  # MD024: Duplicate headings — allow under different parents so Keep a
  # Changelog entries can each have ### Added / ### Changed / ### Fixed.
  MD024:
    siblings_only: true

ignores:
  - "node_modules/**"
  - ".local/**"
  - ".afi/**"
  - ".teken/**"
  # Vendored skills are cited verbatim from guildmaster — do not reformat them.
  - ".claude/skills/**"
  # Installed third-party packages. Load-bearing since deviation d2 gave this
  # package real dependencies: CI runs `markdownlint-cli2 "**/*.md"` AFTER the
  # steps that build .venv, and numpy alone ships several LICENSE.md files that
  # fail MD009/MD012/MD022/MD034/MD041/MD047. Nothing here is ours to reformat,
  # and a lint job that fails on a dependency's licence text teaches everyone to
  # ignore it.
  - ".venv/**"
  - "**/site-packages/**"
  # Generated live-session transcripts. These are EVIDENCE, not prose: the file
  # is a verbatim record of what a model said and what the operator saw, emitted
  # by `examples/scope_live_session.py --transcript`. Reformatting one alters
  # the record it exists to preserve, so it cannot be linted into compliance.
  # The 590 errors on session 1's transcript are almost entirely inside quoted
  # model output — 312x MD038 (spaces in code spans), 38x MD009, plus
  # MD055/MD056 from tables the model itself wrote. Narrow on purpose: authored
  # reports under docs/live-test-results/ (scopebench.md, senses-grounding.md,
  # every preregistration) stay linted, because those are ours to write well.
  # The emitter's own MD040 (untagged fences) is a real defect and is tracked
  # separately — this exclusion must not become the reason it never gets fixed.
  - "docs/live-test-results/*-transcript.md"
  # devague's own working artifacts. `.devague/reviews/` and `.devague/questions/`
  # are gitignored, so CI never sees them — leaving them in only makes a LOCAL
  # run disagree with CI, which is how people learn to distrust a local lint.
  - ".devague/**"
