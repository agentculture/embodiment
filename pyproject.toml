[project]
name = "embodiment"
version = "0.15.0"
description = "The agentic loop that gives an app an embodied AI presence. Install embodiment in an app or wrap one, supply a model seam plus IO callbacks, and it drives the perceive-decide-act loop and the presence pump - extracted from colleague so the loop is written once and imported, not reimplemented per host."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
# Deviation d2 (approved, recorded): eidetic-cli and coherence-cli are BASE
# dependencies imported directly at module scope — the t13 subprocess adapter
# is gone. This reverses constraint C1 (pure-stdlib core) deliberately, and it
# is not free. Each entry below carries what it actually costs:
#
#   eidetic-cli   -> data-refinery-cli[store] -> neo4j + pymongo (graph +
#                    Mongo drivers, pulled even for the default `files` store)
#   coherence-cli -> numpy + httpx (and httpx's own httpcore/h11/anyio/certifi)
#   events-cli    -> paho-mqtt  (consumed by embodiment/events.py, which imports
#                    events_cli lazily so importing embodiment stays cheap)
#   headspace-cli -> docker>=7.1 -> requests, urllib3, certifi,
#                    charset-normalizer, idna. Consumed by
#                    embodiment/workspace.py, which imports `headspace.api` at
#                    MODULE SCOPE — that import is measured as stdlib-only, so
#                    `headspace` is the single new entry in
#                    _REQUIRED_RUNTIME_IMPORTS and `docker`/`requests` stay
#                    install-only, exactly as neo4j/pymongo/paho already do.
#                    `headspace.api` is the ONLY supported import surface
#                    (headspace-cli#18): it declares create/run/put/export/
#                    destroy under headspace's own semver, and
#                    `headspace.core` is private — never import it.
#
# Consequence, accepted with eyes open: `pip install embodiment` now pulls a
# graph driver, a Mongo driver, numpy, httpx and an MQTT client, and importing
# embodiment transitively imports third-party modules. colleague's own
# tests/test_zero_deps.py asserts its dependencies are exactly ["agentfront>=…"]
# and that importing colleague adds no third-party top-level import — so
# colleague CANNOT adopt embodiment until C1b (does colleague relax its
# one-base-dependency rule?) is answered. That is now a hard prerequisite for
# the seam proposal, not an open question.
#
# tests/test_zero_deps.py is the human gate on this list: any addition OR
# removal fails until a human updates the pinned set on purpose.
#
# devague is APPROVED as a base dependency (operator decision, 2026-07-29,
# frame claim c24) but deliberately NOT listed below. The devague-legs
# experiment (issue #20) needs devague only as an external grader, so the
# harness subprocesses `devague plan converge --json` / `devague plan waves
# --json` and parses the result instead of importing the package. That keeps
# the grader external to the process under test and lets every experiment
# run pin and record the exact devague version it was graded by (claim c13),
# rather than freezing to whatever this package's own resolver picked.
# Honesty condition h4 governs the choice: "if the methodology is achievable
# without the import, the dependency stays out; an import that lands must
# name the code that needs it." No code here needs the import, so it stays
# out of both this list and tests/test_zero_deps.py's _APPROVED_DEPENDENCIES.
# Measured so the reasoning cannot drift into a cost argument later: devague
# 0.22.0 declares zero Requires-Dist entries of its own (checked against the
# installed devague-0.22.0.dist-info/METADATA) — this is a decision about
# externality and per-run version-pinning, not about transitive weight. If a
# future task adds a devague import, name that task here and update this
# list and tests/test_zero_deps.py together; do not let it happen silently.
#
# Every entry below has an approval record in the deviation ledger
# (`devague deviate --list`, and `.devague/deliveries/` for earlier cycles).
# A dependency whose floor is not explained here is a floor nobody chose.
#
# websockets>=15 (realtime redesign, plan task t3, approved 2026-09-21): the
# lobes `/v1/realtime` client AND the daemon's inbound audio endpoint server.
# Zero Requires-Dist entries of its own (checked against 17.1's PyPI metadata),
# so it adds exactly one package to every host. The floor is 15 because that is
# the first release whose `websockets.asyncio` client and server are the
# default, non-legacy implementations. lobes ships no importable client, and
# `lobes-cli` must NEVER appear here: the gateway is reached over the network.
#
# headspace-cli left in 0.15.0 with its only consumer (the archived
# workspace.py), taking the docker SDK with it.
dependencies = [
    "eidetic-cli>=0.12",
    "coherence-cli>=0.6",
    "events-cli>=0.10",
    "websockets>=15",
]

# Deviation d4 (operator decision, round 4 of plan task t7): the `audio` extra
# (sounddevice -> cffi -> pycparser, plus the system PortAudio library) is
# WITHDRAWN. embodiment/audio/host.py now drives the microphone/speaker as
# subprocesses (`pw-record`/`pw-play` or `arecord`/`aplay`) — the same shape
# ../lobes-cli and ../shabbos-goy already run against the same hardware — so
# no Python audio binding is installed at all; the backend binaries are a
# runtime PATH lookup (`shutil.which`), not a pip dependency. No extra pin
# replaces this one: there is nothing left for pip to install.

[project.urls]
Homepage = "https://github.com/agentculture/embodiment"
Issues = "https://github.com/agentculture/embodiment/issues"

[project.scripts]
embodiment = "embodiment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embodiment"]

# Task t19: ship the t17 dashboard's built artifact inside the wheel. This
# bypasses git-ignore-based file selection (web/dist is gitignored — it is a
# build artifact, not source) so the files the hook below produces are
# packaged regardless. embodiment/http/server.py:default_dist_dir() reads
# this at runtime; see the t19 handoff note for the path mismatch this task
# found but did not fix (out of scope: server.py belongs to t16).
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "embodiment/web/dist"

# Runs before the wheel's file list is built. Builds web/dist with npm when it
# is missing; refuses the build (raises) rather than shipping an empty
# dashboard. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The sdist ships web/ source (so a wheel built from the sdist can still run
# the hook) but never web/node_modules or web/dist — both are already
# git-ignored, which hatchling's default sdist file selection already
# excludes; listed explicitly so the exclusion survives a change to that
# default.
[tool.hatch.build.targets.sdist]
exclude = [
    "web/node_modules",
    "web/dist",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
]

[tool.coverage.run]
source = ["embodiment"]
omit = ["embodiment/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=embodiment (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["embodiment"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: not selected by default (builds a wheel with npm); tests/test_wheel_ships_the_dashboard.py, run explicitly in CI",
]
